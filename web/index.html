<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="행복한교회 지출청구앱">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>행복한교회 지출청구앱</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // PWA 뒤로가기로 앱이 종료되지 않도록 히스토리 버퍼 추가
    (function() {
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                      || window.navigator.standalone === true;
      if (isStandalone) {
        // 앱 진입 시 더미 히스토리 엔트리를 미리 쌓아둠
        // 다이얼로그 open/close 가 히스토리를 소비하더라도 버퍼가 남도록 5개 추가
        for (var i = 0; i < 5; i++) {
          window.history.pushState({ pwaBuffer: i }, '', window.location.href);
        }
      }
    })();

    // 서비스 워커 등록
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js');
      });
    }
    // PWA 설치 이벤트 캡처
    let _pwaPrompt = null;
    window.pwaInstallAvailable = false;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      _pwaPrompt = e;
      window.pwaInstallAvailable = true;
      window.dispatchEvent(new CustomEvent('pwaReady'));
    });
    window.triggerPwaInstall = function() {
      if (_pwaPrompt) {
        _pwaPrompt.prompt();
        _pwaPrompt.userChoice.then(function() {
          _pwaPrompt = null;
          window.pwaInstallAvailable = false;
        });
      }
    };
  </script>
</body>
</html>
