name: Flutter Web Build & Firebase Deploy

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Flutter 설정
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 의존성 설치
        run: flutter pub get

      - name: 웹 빌드
        run: flutter build web --release

      - name: Google 인증
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.bchappychurch }}

      - name: Firebase Hosting 배포
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project church-expense-app
